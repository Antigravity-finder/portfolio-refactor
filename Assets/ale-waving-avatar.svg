<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Ale saludando</title>
  <desc id="desc">Caricatura animada de Ale, joven, moreno, de pelo rizado y delgado, saludando.</desc>
  <style>
    .wave { animation: wave 1.1s ease-in-out infinite; transform-origin: 446px 348px; }
    .curl { animation: bounce 1.8s ease-in-out infinite alternate; transform-origin: center; }
    .curl:nth-child(2n) { animation-delay: -.6s; }
    .curl:nth-child(3n) { animation-delay: -1.1s; }
    @keyframes wave { 0%, 100% { transform: rotate(-11deg); } 50% { transform: rotate(16deg); } }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .wave, .curl { animation: none; } }
  </style>
